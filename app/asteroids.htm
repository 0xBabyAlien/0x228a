<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crypto Coin Asteroids</title>
<style>
  * { touch-action: none; -webkit-user-select: none; user-select: none; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: linear-gradient(180deg, #2b1055 0%, #7597de 100%);
    overflow: hidden;
    font-family: 'Comic Sans MS', 'Trebuchet MS', sans-serif; color: #fff;
  }
  #gameWrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; max-width: 100%; max-height: 100%; border-radius: 12px; }
  #hud {
    position: fixed; top: 8px; left: 12px; right: 12px;
    display: flex; justify-content: space-between;
    font-size: 18px; font-weight: bold; color: #fff; pointer-events: none;
    text-shadow: 0 2px 0 #ff69b4;
  }
  .ctrlBtn {
    position: fixed; bottom: 16px;
    width: 62px; height: 62px; border-radius: 50%;
    background: rgba(255,255,255,0.25); border: 3px solid #fff;
    color: #fff; font-size: 24px; display: flex; align-items: center; justify-content: center;
    z-index: 10; box-shadow: 0 3px 0 rgba(0,0,0,0.2);
  }
  #leftBtn { left: 16px; }
  #rightBtn { left: 86px; }
  #thrustBtn { left: 156px; font-size: 20px; background: rgba(255,200,80,0.3); border-color: #ffc850; }
  #fireBtn { right: 16px; width: 76px; height: 76px; font-size: 13px; background: rgba(255,110,150,0.3); border-color: #ff6e96; color: #fff; }
  #overlay {
    position: fixed; inset: 0; background: rgba(60,20,90,0.9);
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    color: #fff; text-align: center; z-index: 20;
  }
  #overlayText { font-size: 26px; text-shadow: 0 3px 0 #ff69b4; }
  #overlay button {
    margin-top: 18px; padding: 12px 32px; font-size: 17px;
    background: #ffe066; color: #6a3900; border: none; border-radius: 30px; font-weight: bold;
    box-shadow: 0 4px 0 #d1a800;
  }
  #rotateMsg {
    position: fixed; inset: 0; background: #2b1055; color: #fff;
    display: none; align-items: center; justify-content: center;
    text-align: center; font-size: 18px; z-index: 30; padding: 20px;
  }
  @media (orientation: portrait) {
    #rotateMsg { display: flex; }
    #gameWrap, #hud, .ctrlBtn { display: none; }
  }
  #nameInput {
  margin-top: 14px; padding: 10px 16px; font-size: 16px; font-family: inherit;
  border: none; border-radius: 20px; outline: none; text-align: center;
  width: 200px; max-width: 70vw;
}
#nameInput::placeholder { color: #9a8bc4; }
#leaderboardBox {
  margin-top: 22px; background: rgba(255,255,255,0.08);
  border: 2px solid rgba(255,255,255,0.25); border-radius: 16px;
  padding: 10px 18px; min-width: 220px; max-width: 80vw; max-height: 30vh; overflow-y: auto;
}
#leaderboardTitle { font-size: 15px; margin-bottom: 6px; }
#leaderboardList { list-style: none; margin: 0; padding: 0; text-align: left; font-size: 13px; }
#leaderboardList li { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; }
#leaderboardList li.me { color: #ffe066; font-weight: bold; }
#leaderboardEmpty { font-size: 12px; opacity: 0.7; }
</style>
</head>
<body>
<div id="rotateMsg">📱↔️<br>Rotate your phone to landscape mode to play</div>
<div id="hud">
  <div id="score">⭐ SCORE: 0</div>
  <div id="lives">💖 LIVES: 3</div>
</div>
<div id="gameWrap"><canvas id="game" width="800" height="400"></canvas></div>
<div id="leftBtn" class="ctrlBtn">↺</div>
<div id="rightBtn" class="ctrlBtn">↻</div>
<div id="thrustBtn" class="ctrlBtn">🚀</div>
<div id="fireBtn" class="ctrlBtn">FIRE</div>

<div id="overlay">
  <div id="overlayText">🪙 CRYPTO COIN ASTEROIDS 🪙</div>
  <div style="font-size:13px;margin-top:8px;">Arrow/A-D to rotate, W/Up to thrust, Space to fire</div>
  <input id="nameInput" type="text" maxlength="16" placeholder="Your name" autocomplete="off">
  <button id="startBtn">START</button>
  <div id="leaderboardBox">
    <div id="leaderboardTitle">🏆 Top Scores</div>
    <ol id="leaderboardList"></ol>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

let ship, bullets, asteroids, particles, stars, score, lives, gameRunning, loopId;
let rotLeft = false, rotRight = false, thrusting = false;

const coinTypes = [
  { symbol: '₿', color: '#f7931a', dark: '#a85e00' },
  { symbol: 'Ξ', color: '#8a92f0', dark: '#4c53a8' },
  { symbol: 'Ð', color: '#e8c545', dark: '#a88b1a' },
  { symbol: 'Ł', color: '#b9c3d9', dark: '#5c6f94' },
  { symbol: '₮', color: '#5fd6a8', dark: '#1f8f66' }
];
const bgStarColors = ['#fff', '#ffe6f2', '#e0f7ff'];

function wrap(obj) {
  if (obj.x < 0) obj.x += W;
  if (obj.x > W) obj.x -= W;
  if (obj.y < 0) obj.y += H;
  if (obj.y > H) obj.y -= H;
}

function resetGame() {
  ship = { x: W/2, y: H/2, angle: -Math.PI/2, vx: 0, vy: 0, radius: 14, invincible: 120 };
  bullets = [];
  asteroids = [];
  particles = [];
  score = 0;
  lives = 3;
  spawnAsteroids(5);
  updateHud();
}

function makeStars() {
  stars = [];
  for (let i = 0; i < 45; i++) {
    stars.push({ x: Math.random()*W, y: Math.random()*H, r: 1 + Math.random()*2, tw: Math.random()*Math.PI*2, color: bgStarColors[Math.floor(Math.random()*bgStarColors.length)] });
  }
}
makeStars();

function spawnAsteroids(n, avoidCenter = true) {
  for (let i = 0; i < n; i++) {
    let x, y;
    do {
      x = Math.random() * W;
      y = Math.random() * H;
    } while (avoidCenter && Math.hypot(x - W/2, y - H/2) < 120);
    asteroids.push(makeAsteroid(x, y, 3));
  }
}

function makeAsteroid(x, y, size) {
  const radius = size * 16;
  const speed = 0.4 + Math.random() * (3.2 - size);
  const dir = Math.random() * Math.PI * 2;
  const coin = coinTypes[Math.floor(Math.random()*coinTypes.length)];
  return {
    x, y, size, radius,
    vx: Math.cos(dir) * speed,
    vy: Math.sin(dir) * speed,
    rot: 0, rotSpeed: (Math.random() - 0.5) * 0.04,
    color: coin.color,
    darkColor: coin.dark,
    symbol: coin.symbol,
    wobble: Math.random()*Math.PI*2
  };
}

function updateHud() {
  document.getElementById('score').textContent = '⭐ SCORE: ' + score;
  document.getElementById('lives').textContent = '💖 LIVES: ' + lives;
}

function spawnBurst(x, y, color, n = 10) {
  for (let i = 0; i < n; i++) {
    const a = Math.random()*Math.PI*2;
    const sp = 1 + Math.random()*3;
    particles.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: 24 + Math.random()*12, color, r: 2 + Math.random()*3 });
  }
}

function drawShip() {
  if (ship.invincible > 0 && Math.floor(ship.invincible / 5) % 2 === 0) return;
  ctx.save();
  ctx.translate(ship.x, ship.y);
  // body stays upright — only a small direction indicator rotates,
  // so the UFO never looks upside-down

  // thrust glow, positioned opposite of facing direction
  if (thrusting) {
    const wob = 1 + Math.random()*0.3;
    const bx = Math.cos(ship.angle + Math.PI) * 15;
    const by = Math.sin(ship.angle + Math.PI) * 15;
    ctx.fillStyle = 'rgba(180,255,220,0.7)';
    ctx.beginPath();
    ctx.ellipse(bx, by, 6*wob, 6*wob, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,180,0.8)';
    ctx.beginPath();
    ctx.ellipse(bx, by, 2.5*wob, 2.5*wob, 0, 0, Math.PI*2);
    ctx.fill();
  }

  // saucer body (always upright)
  ctx.fillStyle = '#c9a9ff';
  ctx.beginPath();
  ctx.ellipse(0, 3, 16, 7, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // rim lights, blinking
  const t = Date.now() / 150;
  const lightPos = [-10, -3, 4, 11];
  lightPos.forEach((lx, i) => {
    const glow = 0.5 + 0.5*Math.sin(t + i*1.5);
    ctx.fillStyle = `rgba(255,${210 + Math.floor(glow*45)},120,${0.6+glow*0.4})`;
    ctx.beginPath();
    ctx.arc(lx, 6.5, 1.6, 0, Math.PI*2);
    ctx.fill();
  });

  // dome (always upright)
  ctx.fillStyle = 'rgba(200,240,255,0.9)';
  ctx.beginPath();
  ctx.arc(0, 0, 9, Math.PI, 0);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // dome highlight
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.beginPath();
  ctx.ellipse(-3, -4, 3, 1.6, -0.4, 0, Math.PI*2);
  ctx.fill();

  // cute face, always looking forward at the viewer
  ctx.fillStyle = '#3a3a6a';
  ctx.beginPath();
  ctx.arc(-3, -2, 1.6, 0, Math.PI*2);
  ctx.arc(3, -2, 1.6, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = '#3a3a6a';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(0, 0.5, 2, 0.1*Math.PI, 0.9*Math.PI);
  ctx.stroke();

  // small rotating direction beam showing which way it's aiming/thrusting
  ctx.save();
  ctx.rotate(ship.angle);
  ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(14, 0);
  ctx.lineTo(19, 0);
  ctx.stroke();
  ctx.restore();

  ctx.restore();
}

function drawAsteroids() {
  asteroids.forEach(a => {
    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.rotate(a.rot);

    // blobby cute rock (wobbly circle)
    ctx.fillStyle = a.color;
    ctx.beginPath();
    const pts = 10;
    for (let i = 0; i <= pts; i++) {
      const t = (i/pts) * Math.PI * 2;
      const wob = 1 + 0.12*Math.sin(t*3 + a.wobble);
      const px = Math.cos(t) * a.radius * wob;
      const py = Math.sin(t) * a.radius * wob;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.lineWidth = 2;
    ctx.stroke();

    // koin: cincin dalam
    ctx.strokeStyle = a.darkColor;
    ctx.lineWidth = Math.max(1.5, a.radius*0.1);
    ctx.beginPath();
    ctx.arc(0, 0, a.radius*0.72, 0, Math.PI*2);
    ctx.stroke();

    // simbol koin di tengah
    ctx.fillStyle = a.darkColor;
    ctx.font = `bold ${Math.round(a.radius*0.85)}px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(a.symbol, 0, a.radius*0.06);

    // mata imut mengintip di atas simbol
    ctx.fillStyle = '#4a3b5c';
    const eyeOff = a.radius * 0.34;
    ctx.beginPath();
    ctx.arc(-eyeOff, -a.radius*0.55, a.radius*0.09, 0, Math.PI*2);
    ctx.arc(eyeOff, -a.radius*0.55, a.radius*0.09, 0, Math.PI*2);
    ctx.fill();

    // pipi merona
    ctx.fillStyle = 'rgba(255,140,170,0.5)';
    ctx.beginPath();
    ctx.arc(-eyeOff*1.6, a.radius*0.15, a.radius*0.1, 0, Math.PI*2);
    ctx.arc(eyeOff*1.6, a.radius*0.15, a.radius*0.1, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();
  });
}

function drawBullets() {
  bullets.forEach(b => {
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.fillStyle = '#fff566';
    ctx.strokeStyle = '#ff9d00';
    ctx.lineWidth = 1;
    drawStarShape(0, 0, 5, 6, 3);
    ctx.fill();
    ctx.restore();
  });
}

function drawStarShape(cx, cy, spikes, outerR, innerR) {
  let rot = Math.PI/2*3;
  const step = Math.PI/spikes;
  ctx.beginPath();
  ctx.moveTo(cx, cy - outerR);
  for (let i = 0; i < spikes; i++) {
    let x = cx + Math.cos(rot) * outerR;
    let y = cy + Math.sin(rot) * outerR;
    ctx.lineTo(x, y);
    rot += step;
    x = cx + Math.cos(rot) * innerR;
    y = cy + Math.sin(rot) * innerR;
    ctx.lineTo(x, y);
    rot += step;
  }
  ctx.lineTo(cx, cy - outerR);
  ctx.closePath();
}

function drawParticles() {
  particles.forEach(p => {
    ctx.globalAlpha = Math.max(0, p.life/30);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

function drawBackground() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#2b1055');
  grad.addColorStop(1, '#7597de');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  stars.forEach(s => {
    s.tw += 0.05;
    ctx.globalAlpha = 0.5 + 0.5*Math.sin(s.tw);
    ctx.fillStyle = s.color;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

function update() {
  if (!gameRunning) return;

  if (rotLeft) ship.angle -= 0.06;
  if (rotRight) ship.angle += 0.06;
  if (thrusting) {
    ship.vx += Math.cos(ship.angle) * 0.15;
    ship.vy += Math.sin(ship.angle) * 0.15;
  }
  ship.vx *= 0.99;
  ship.vy *= 0.99;
  ship.x += ship.vx;
  ship.y += ship.vy;
  wrap(ship);
  if (ship.invincible > 0) ship.invincible--;

  bullets.forEach(b => { b.x += b.vx; b.y += b.vy; b.life--; });
  bullets = bullets.filter(b => b.life > 0);

  asteroids.forEach(a => {
    a.x += a.vx; a.y += a.vy; a.rot += a.rotSpeed;
    wrap(a);
  });

  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life--; });
  particles = particles.filter(p => p.life > 0);

  bullets.forEach(b => {
    asteroids.forEach(a => {
      if (a.hit) return;
      if (Math.hypot(b.x - a.x, b.y - a.y) < a.radius) {
        a.hit = true;
        b.life = 0;
        score += (4 - a.size) * 20;
        updateHud();
        spawnBurst(a.x, a.y, a.color, 14);
        if (a.size > 1) {
          asteroids.push(makeAsteroid(a.x, a.y, a.size - 1));
          asteroids.push(makeAsteroid(a.x, a.y, a.size - 1));
        }
      }
    });
  });
  asteroids = asteroids.filter(a => !a.hit);

  if (ship.invincible <= 0) {
    asteroids.forEach(a => {
      if (Math.hypot(ship.x - a.x, ship.y - a.y) < a.radius + ship.radius) {
        lives--;
        updateHud();
        spawnBurst(ship.x, ship.y, '#ff8fab', 18);
        ship.x = W/2; ship.y = H/2; ship.vx = 0; ship.vy = 0;
        ship.invincible = 120;
        if (lives <= 0) endGame();
      }
    });
  }

  if (asteroids.length === 0) spawnAsteroids(5 + Math.floor(score / 200));
}

function draw() {
  drawBackground();
  drawAsteroids();
  drawBullets();
  drawParticles();
  drawShip();
}

function loop() {
  update();
  draw();
  if (gameRunning) loopId = requestAnimationFrame(loop);
}

async function endGame() {
  gameRunning = false;
  cancelAnimationFrame(loopId);
  document.getElementById('overlayText').textContent = `😵 GAME OVER - Score: ${score}`;
  document.getElementById('startBtn').textContent = 'PLAY AGAIN';
  document.getElementById('overlay').style.display = 'flex';

  try {
    const res = await fetch(LEADERBOARD_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: playerName, score })
    });
    const data = await res.json();
    if (data.scores) renderLeaderboard(data.scores, playerName);
  } catch (err) {
    loadLeaderboard(playerName);
  }
}

function startGame() {
  const typed = nameInput.value.trim().slice(0, 16);
  playerName = typed || 'Anonymous';
  localStorage.setItem('asteroids_playerName', playerName);
  resetGame();
  gameRunning = true;
  document.getElementById('overlay').style.display = 'none';
  loop();
}
const LEADERBOARD_ENDPOINT = '/api/leaderboard';
let playerName = 'Anonymous';

const nameInput = document.getElementById('nameInput');
nameInput.value = localStorage.getItem('asteroids_playerName') || '';

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderLeaderboard(scores, highlightName) {
  const list = document.getElementById('leaderboardList');
  if (!scores || !scores.length) {
    list.innerHTML = '<div id="leaderboardEmpty">No scores yet — be the first!</div>';
    return;
  }
  list.innerHTML = scores.map((s, i) => {
    const isMe = highlightName && s.name === highlightName;
    return `<li class="${isMe ? 'me' : ''}"><span>${i+1}. ${escapeHtml(s.name)}</span><span>${s.score}</span></li>`;
  }).join('');
}

async function loadLeaderboard(highlightName) {
  try {
    const res = await fetch(LEADERBOARD_ENDPOINT);
    const data = await res.json();
    renderLeaderboard(data.scores, highlightName);
  } catch (err) {
    document.getElementById('leaderboardList').innerHTML = '<div id="leaderboardEmpty">Leaderboard unavailable.</div>';
  }
}
loadLeaderboard();
document.getElementById('startBtn').addEventListener('click', startGame);

function fire() {
  if (!gameRunning) return;
  bullets.push({
    x: ship.x + Math.cos(ship.angle) * 16,
    y: ship.y + Math.sin(ship.angle) * 16,
    vx: Math.cos(ship.angle) * 7 + ship.vx,
    vy: Math.sin(ship.angle) * 7 + ship.vy,
    life: 60
  });
}

document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'arrowleft' || k === 'a') rotLeft = true;
  if (k === 'arrowright' || k === 'd') rotRight = true;
  if (k === 'arrowup' || k === 'w') thrusting = true;
  if (k === ' ') { fire(); e.preventDefault(); }
});
document.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if (k === 'arrowleft' || k === 'a') rotLeft = false;
  if (k === 'arrowright' || k === 'd') rotRight = false;
  if (k === 'arrowup' || k === 'w') thrusting = false;
});

function bindBtn(id, onDown, onUp) {
  const el = document.getElementById(id);
  el.addEventListener('touchstart', e => { e.preventDefault(); onDown(); });
  el.addEventListener('touchend', e => { e.preventDefault(); onUp && onUp(); });
  el.addEventListener('mousedown', onDown);
  el.addEventListener('mouseup', () => onUp && onUp());
  el.addEventListener('mouseleave', () => onUp && onUp());
}
bindBtn('leftBtn', () => rotLeft = true, () => rotLeft = false);
bindBtn('rightBtn', () => rotRight = true, () => rotRight = false);
bindBtn('thrustBtn', () => thrusting = true, () => thrusting = false);
bindBtn('fireBtn', () => fire());

function resizeCanvas() {
  const scale = Math.min(window.innerWidth / W, (window.innerHeight - 20) / H);
  canvas.style.width = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

resetGame();
draw();
</script>
</body>
</html>
